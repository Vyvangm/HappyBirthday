<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎉</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; text-align: center; background: linear-gradient(to right, #ffc1c3, #fff1ee); color: rgb(0, 0, 0); overflow-x: hidden; }
    h1 { font-size: 3rem; margin-top: 20vh; }
    .btn { padding: 15px 25px; font-size: 1.2rem; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; background: white; color: #ff6b81; }
    .hidden { display: none; }
    .section { padding: 50px 20px; }

    .slideshow-container { position: relative; max-width: 500px; margin: auto; }
    .slide { display: none; }
    .slide img { width: 100%; height: 300px; object-fit: cover; border-radius: 15px; }

    .prev, .next {
      cursor: pointer; position: absolute; top: 50%; transform: translateY(-50%);
      padding: 10px; color: white; font-weight: bold; font-size: 18px;
      border-radius: 50%; background: rgba(0,0,0,0.4);
    }
    .prev { left: 10px; }
    .next { right: 10px; }

    #typing { font-size: 1.2rem; max-width: 600px; margin: auto; min-height: 80px; }

    #gameArea { position: relative; height: 300px; border: 2px dashed white; overflow: hidden; }
    .cake { position: absolute; font-size: 2rem; cursor: pointer; }

    .confetti { position: fixed; width: 10px; height: 10px; top: 0; animation: fall linear infinite; }
    @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
  </style>
</head>
<body>

  <h1>Happy Birthday, Bakla 🎂</h1>
  <button class="btn" onclick="startExperience()">Click me!</button>

  <div id="content" class="hidden">

    <div class="section">
      <audio id="bgMusic" controls loop>
        <source src="Indian sing happy birthday.mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="section">
      <h2>💌 Message</h2>
      <p id="typing"></p>
    </div>

    <div class="section">
      <h2>📸 Memories</h2>
      <div class="slideshow-container">
        <div class="slide"><img src="images/Image (1).jfif"></div>
        <div class="slide"><img src="images/Image (2).jfif"></div>
        <div class="slide"><img src="images/Image (3).jfif"></div>
        <div class="slide"><img src="images/Image (4).jfif"></div>
        <div class="slide"><img src="images/Image (5).jfif"></div>
        <div class="slide"><img src="images/Image (6).jfif"></div>
        <div class="slide"><img src="images/Image (7).jfif"></div>
        <div class="slide"><img src="images/Image (8).jfif"></div>
        <div class="slide"><img src="images/Image (9).jfif"></div>
        <div class="slide"><img src="images/Image (10).jfif"></div>
        <div class="slide"><img src="images/Image (11).jfif"></div>

        <span class="prev" onclick="changeSlide(-1)">&#10094;</span>
        <span class="next" onclick="changeSlide(1)">&#10095;</span>
      </div>
    </div>

    <div class="section">
      <h2>Saluhin mo ang beat</h2>
      <p>Score: <span id="score">0</span></p>
      <div id="gameArea"></div>
    </div>

  </div>

  <script>
    const message = "Happy Birthday bakla, baks, blosem HUWAW LAHAT LETTER B 🎉 10+ years na ata tayong magkaibigan buti di pa tayo nagsasawa sa isa't isa. Nawa'y mabuti at masaya ang imong future endeavors pero shempre dapat kasama aq sa future mo,, ewan ko nalang talaga kung inde nako nako.. LABYU ALWAYS, GALA SOON, GASTOS PERA SOON, SLEEP OVER SOON???? HUI?!?! MIMING SOON???? ayun lang hihi habertdei ulii! 💖";

    function startExperience() {
      document.getElementById("content").classList.remove("hidden");
      typeMessage();
      createConfetti();
      startGame();
      showSlide(slideIndex);

      // AUTOPLAY MUSIC FIX
      const music = document.getElementById("bgMusic");
      music.play().catch(() => {
        console.log("Autoplay blocked");
      });
    }

    function typeMessage() {
      let i = 0;
      function typing() {
        if (i < message.length) {
          document.getElementById("typing").innerHTML += message.charAt(i);
          i++;
          setTimeout(typing, 40);
        }
      }
      typing();
    }

    function createConfetti() {
      for (let i = 0; i < 80; i++) {
        let confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
        confetti.style.backgroundColor = randomColor();
        document.body.appendChild(confetti);
      }
    }

    function randomColor() {
      const colors = ["#ff6b81", "#feca57", "#48dbfb", "#1dd1a1", "#ff9ff3"];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    let slideIndex = 0;

    function showSlide(n) {
      const slides = document.getElementsByClassName("slide");
      if (slides.length === 0) return;

      if (n >= slides.length) slideIndex = 0;
      if (n < 0) slideIndex = slides.length - 1;

      for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
      }

      slides[slideIndex].style.display = "block";
    }

    function changeSlide(n) {
      slideIndex += n;
      showSlide(slideIndex);
    }

    setInterval(() => {
      slideIndex++;
      showSlide(slideIndex);
    }, 3000);

    let score = 0;
    function startGame() { setInterval(spawnCake, 800); }

    function spawnCake() {
      const gameArea = document.getElementById("gameArea");
      const cake = document.createElement("div");
      cake.classList.add("cake");
      cake.innerHTML = "🎂";

      cake.style.left = Math.random() * 90 + "%";
      cake.style.top = "0px";
      gameArea.appendChild(cake);

      let fall = setInterval(() => {
        cake.style.top = cake.offsetTop + 5 + "px";
        if (cake.offsetTop > 260) {
          cake.remove();
          clearInterval(fall);
        }
      }, 50);

      cake.onclick = () => {
        score++;
        document.getElementById("score").innerText = score;
        cake.remove();
        clearInterval(fall);
      };
    }
  </script>

</body>
</html>
